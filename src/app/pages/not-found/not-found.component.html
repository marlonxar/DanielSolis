<!-- Film backdrop — consistente con el resto del sitio -->
<div class="film-backdrop" aria-hidden="true">
    <video autoplay [muted]="true" loop playsinline preload="auto"
           poster="assets/images/film-grain-poster.jpg" class="film-video">
      <source src="assets/videos/film-grain.mp4" type="video/mp4" />
    </video>
    <div class="film-vignette"></div>
  </div>
  
  <main class="error-page" id="main-content" role="main">
  
    <!-- Número 404 de fondo decorativo -->
    <div class="deco-404" aria-hidden="true">
      <span>4</span>
      <span>0</span>
      <span>4</span>
    </div>
  
    <!-- Contenido central -->
    <div class="error-content">
  
      <!-- Eyebrow -->
      <div class="error-eyebrow">
        <span class="eyebrow-line" aria-hidden="true"></span>
        <span class="eyebrow-text">Error 404</span>
        <span class="eyebrow-line" aria-hidden="true"></span>
      </div>
  
      <!-- Título principal -->
      <h1 class="error-title">
        <span class="title-line">Escena</span>
        <span class="title-line title-line--ghost">No encontrada</span>
      </h1>
  
      <!-- Descripción -->
      <p class="error-description">
        La página que buscas no existe, fue movida o simplemente nunca estuvo en el guión.
        Volvamos a terreno conocido.
      </p>
  
      <!-- Countdown + acciones -->
      <div class="error-actions">
  
        <button
          class="btn-primary"
          (click)="goHome()"
          type="button"
          aria-label="Volver al inicio"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Volver al inicio</span>
          <span class="btn-countdown" aria-live="polite" aria-atomic="true">({{ countdown }}s)</span>
        </button>
  
        <button
          class="btn-secondary"
          (click)="goBack()"
          type="button"
          aria-label="Regresar a la página anterior"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          <span>Página anterior</span>
        </button>
  
      </div>
  
      <!-- Links rápidos -->
      <nav class="error-nav" aria-label="Páginas principales">
        <span class="nav-label">O explorá</span>
        <ul class="nav-links" role="list">
          <li>
            <a routerLink="/portafolio" class="nav-link">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
              Portafolio
            </a>
          </li>
          <li>
            <a routerLink="/contacto" class="nav-link">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
              Contacto
            </a>
          </li>
        </ul>
      </nav>
  
    </div>
  
    <!-- Scan line animada decorativa -->
    <div class="scan-line" aria-hidden="true"></div>
  
    <!-- Footer mínimo -->
    <footer class="error-footer">
      <span class="footer-brand">Daniel Solís © 2026</span>
      <span class="footer-sep" aria-hidden="true">—</span>
      <span class="footer-copy">Producción audiovisual · Costa Rica</span>
    </footer>
  
  </main>
